name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: runtime/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:web
      - run: pnpm test:runtime
      - run: pnpm build:sidecar
      - run: pnpm test:sidecar
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Apix-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
